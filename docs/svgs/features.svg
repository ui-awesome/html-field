<svg viewBox="0 0 1200 380" width="100%" height="340" xmlns="http://www.w3.org/2000/svg">
    <style>
        text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .box-bg { fill: #e6f4ea; stroke: #a7cdb3; stroke-width: 1; }
        .title { font-weight: 700; font-size: 16px; fill: #1a202c; }
        .content { font-size: 13px; fill: #4a5568; }
    </style>

    <g>
        <rect class="box-bg" x="20" y="20" width="570" height="100" rx="6"/>
        <rect x="20" y="20" width="4" height="100" fill="#1f883d"/>
        <text class="title" x="40" y="50">Error and Hint Rendering</text>
        <text class="content" x="40" y="78">Per-property error and hint blocks with configurable tags and classes</text>
        <text class="content" x="40" y="98">First error or all errors, plus valid and invalid state classes</text>
    </g>

    <g>
        <rect class="box-bg" x="610" y="20" width="570" height="100" rx="6"/>
        <rect x="610" y="20" width="4" height="100" fill="#1f883d"/>
        <text class="title" x="630" y="50">Flexible Layout Templates</text>
        <text class="content" x="630" y="78">Template, container and input container composition per field</text>
        <text class="content" x="630" y="98">Labels can enclose checkbox and radio controls</text>
    </g>

    <g>
        <rect class="box-bg" x="20" y="140" width="570" height="100" rx="6"/>
        <rect x="20" y="140" width="4" height="100" fill="#1f883d"/>
        <text class="title" x="40" y="170">Form Model Binding</text>
        <text class="content" x="40" y="198">Resolves id, name, label, hint and value from the form model</text>
        <text class="content" x="40" y="218">Unknown properties fail fast with AttributeNotSet</text>
    </g>

    <g>
        <rect class="box-bg" x="610" y="140" width="570" height="100" rx="6"/>
        <rect x="610" y="140" width="4" height="100" fill="#1f883d"/>
        <text class="title" x="630" y="170">Immutable Fluent API</text>
        <text class="content" x="630" y="198">Clone-based configuration keeps every derived field independent</text>
        <text class="content" x="630" y="218">Reuse base field definitions safely across forms</text>
    </g>

    <g>
        <rect class="box-bg" x="20" y="260" width="570" height="100" rx="6"/>
        <rect x="20" y="260" width="4" height="100" fill="#1f883d"/>
        <text class="title" x="40" y="290">Per-Property Configuration</text>
        <text class="content" x="40" y="318">Form model field configs configure the field and its control</text>
        <text class="content" x="40" y="338">User configuration remains the final override layer</text>
    </g>

    <g>
        <rect class="box-bg" x="610" y="260" width="570" height="100" rx="6"/>
        <rect x="610" y="260" width="4" height="100" fill="#1f883d"/>
        <text class="title" x="630" y="290">Semantic Control Factory</text>
        <text class="content" x="630" y="318">field.control.* registry resolved through application-scoped Config</text>
        <text class="content" x="630" y="338">Immutable with() derivation registers or replaces controls</text>
    </g>
</svg>
